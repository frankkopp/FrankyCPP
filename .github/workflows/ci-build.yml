name: CI Build

on:
  push:
    branches: [ master, 'dev_*' ]
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.1.0, etc.
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        shell: pwsh
        run: |
          # Use pre-installed vcpkg on GitHub runners
          Write-Host "vcpkg location: C:\vcpkg"
          if (Test-Path C:\vcpkg\vcpkg.exe) {
            Write-Host "vcpkg is available"
            C:\vcpkg\vcpkg.exe version
          } else {
            Write-Host "Bootstrapping vcpkg..."
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          # Set environment variable for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"
          # Enable binary caching to GitHub Actions cache
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite"

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add Ninja to PATH
        run: |
          choco install ninja -y
          ninja --version

      - name: Configure CMake
        shell: pwsh
        run: |
          # Retry logic for transient vcpkg download failures
          $maxAttempts = 3
          $attempt = 0
          $success = $false
          
          do {
            $attempt++
            Write-Host "Configure attempt $attempt of $maxAttempts"
            
            # Explicitly specify MSVC compilers to avoid MinGW
            cmake -B build `
              -G Ninja `
              -DCMAKE_C_COMPILER=cl `
              -DCMAKE_CXX_COMPILER=cl `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
              -DFRANKYCPP_BUILD_TESTS=ON `
              -DFRANKYCPP_BUILD_BENCHMARKS=OFF `
              -DSTRICT_WARNINGS=OFF
            
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            
            if ($attempt -lt $maxAttempts) {
              Write-Host "Configure failed, waiting 30 seconds before retry..."
              Start-Sleep -Seconds 30
            }
          } while ($attempt -lt $maxAttempts)
          
          if (-not $success) {
            Write-Host "Configure failed after $maxAttempts attempts"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Cache Syzygy 3-4 piece tablebases
        id: cache-syzygy-win
        uses: actions/cache@v4
        with:
          path: ./test_syzygy
          key: syzygy-3-4-v1

      - name: Download test tablebases
        if: steps.cache-syzygy-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Download minimal 3-4 piece Syzygy tablebases for testing
          New-Item -ItemType Directory -Force -Path test_syzygy
          
          $baseUrl = "https://tablebase.lichess.ovh/tables/standard/3-4-5/"
          $files = @(
            # 3-piece WDL (5 files)
            "KBvK.rtbw", "KNvK.rtbw", "KPvK.rtbw", "KQvK.rtbw", "KRvK.rtbw",
            # 4-piece WDL - all 35 files
            "KBBvK.rtbw", "KBNvK.rtbw", "KBPvK.rtbw", "KBvKB.rtbw", "KBvKN.rtbw", "KBvKP.rtbw",
            "KNNvK.rtbw", "KNPvK.rtbw", "KNvKN.rtbw", "KNvKP.rtbw",
            "KPPvK.rtbw", "KPvKP.rtbw",
            "KQBvK.rtbw", "KQNvK.rtbw", "KQPvK.rtbw", "KQQvK.rtbw", "KQRvK.rtbw",
            "KQvKB.rtbw", "KQvKN.rtbw", "KQvKP.rtbw", "KQvKQ.rtbw", "KQvKR.rtbw",
            "KRBvK.rtbw", "KRNvK.rtbw", "KRPvK.rtbw", "KRRvK.rtbw",
            "KRvKB.rtbw", "KRvKN.rtbw", "KRvKP.rtbw", "KRvKR.rtbw"
          )
          
          foreach ($file in $files) {
            $url = "$baseUrl$file"
            $dest = "test_syzygy/$file"
            Write-Host "Downloading $file..."
            try {
              Invoke-WebRequest -Uri $url -OutFile $dest -TimeoutSec 60
            } catch {
              Write-Host "Warning: Failed to download $file - $_"
            }
          }
          
          Write-Host "Downloaded tablebase files:"
          Get-ChildItem test_syzygy

      - name: Run tests
        shell: pwsh
        working-directory: build
        env:
          SYZYGY_PATH: ${{ github.workspace }}/test_syzygy
        run: |
          ctest -C Release `
            --output-on-failure `
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Prepare release package
        shell: pwsh
        run: |
          # Create release package directory
          New-Item -ItemType Directory -Force -Path release-package
          
          # Copy executable
          Copy-Item build/src/FrankyCPP_*.exe release-package/
          
          # Copy config and books folders
          Copy-Item -Recurse build/src/config release-package/
          Copy-Item -Recurse build/src/books release-package/
          
          # Remove cache files
          Get-ChildItem -Path release-package/books -Filter "*.cache.*" -Recurse | Remove-Item
          
          Write-Host "Release package contents:"
          Get-ChildItem -Recurse release-package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-windows-Release
          path: release-package/
          retention-days: 30

  build-linux:
    name: Linux (${{ matrix.compiler }}) Release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup build environment
        run: |
          chmod +x ./setup_linux_build_env.sh
          # Pass environment variables through sudo and preserve working directory
          sudo -E bash -c "cd $(pwd) && ./setup_linux_build_env.sh --install"
        env:
          CI: true
          GITHUB_ACTIONS: true

      - name: Setup vcpkg environment
        run: |
          # In CI, vcpkg is installed to /opt/vcpkg by the setup script
          if [ -d "/opt/vcpkg" ]; then
            echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV
            echo "Using vcpkg at /opt/vcpkg"
          elif [ -d "$HOME/vcpkg" ]; then
            echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
            echo "Using vcpkg at $HOME/vcpkg"
          else
            echo "ERROR: vcpkg not found"
            exit 1
          fi
          # Enable binary caching to GitHub Actions cache
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # Retry logic for transient vcpkg download failures
          max_attempts=3
          attempt=0
          success=false
          
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Configure attempt $attempt of $max_attempts"
            
            if cmake -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
              -DVCPKG_TARGET_TRIPLET=x64-linux \
              -DFRANKYCPP_BUILD_TESTS=ON \
              -DFRANKYCPP_BUILD_BENCHMARKS=OFF \
              -DSTRICT_WARNINGS=OFF; then
              success=true
              break
            fi
            
            if [ $attempt -lt $max_attempts ]; then
              echo "Configure failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          
          if [ "$success" != "true" ]; then
            echo "Configure failed after $max_attempts attempts"
            exit 1
          fi

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Cache Syzygy 3-4 piece tablebases
        id: cache-syzygy-linux
        uses: actions/cache@v4
        with:
          path: ./test_syzygy
          key: syzygy-3-4-v1

      - name: Download test tablebases
        if: steps.cache-syzygy-linux.outputs.cache-hit != 'true'
        run: |
          # Download minimal 3-4 piece Syzygy tablebases for testing
          mkdir -p test_syzygy
          
          BASE_URL="https://tablebase.lichess.ovh/tables/standard/3-4-5/"
          FILES=(
            # 3-piece WDL (5 files)
            "KBvK.rtbw" "KNvK.rtbw" "KPvK.rtbw" "KQvK.rtbw" "KRvK.rtbw"
            # 4-piece WDL - all 30 files (K+2 vs K: 15 files, K+1 vs K+1: 15 files)
            "KBBvK.rtbw" "KBNvK.rtbw" "KBPvK.rtbw" "KBvKB.rtbw" "KBvKN.rtbw" "KBvKP.rtbw"
            "KNNvK.rtbw" "KNPvK.rtbw" "KNvKN.rtbw" "KNvKP.rtbw"
            "KPPvK.rtbw" "KPvKP.rtbw"
            "KQBvK.rtbw" "KQNvK.rtbw" "KQPvK.rtbw" "KQQvK.rtbw" "KQRvK.rtbw"
            "KQvKB.rtbw" "KQvKN.rtbw" "KQvKP.rtbw" "KQvKQ.rtbw" "KQvKR.rtbw"
            "KRBvK.rtbw" "KRNvK.rtbw" "KRPvK.rtbw" "KRRvK.rtbw"
            "KRvKB.rtbw" "KRvKN.rtbw" "KRvKP.rtbw" "KRvKR.rtbw"
          )
          
          for file in "${FILES[@]}"; do
            echo "Downloading $file..."
            curl -sS -o "test_syzygy/$file" "${BASE_URL}${file}" || echo "Warning: Failed to download $file"
          done
          
          echo "Downloaded tablebase files:"
          ls -la test_syzygy

      - name: Run tests
        working-directory: build
        env:
          SYZYGY_PATH: ${{ github.workspace }}/test_syzygy
        run: |
          ctest -C Release \
            --output-on-failure \
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Prepare release package
        if: matrix.compiler == 'gcc'
        run: |
          # Create release package directory
          mkdir -p release-package
          
          # Copy executable (only the main one, not test)
          find build/src -maxdepth 1 -name "FrankyCPP_*" -type f -executable ! -name "*Test*" -exec cp {} release-package/ \;
          
          # Copy config and books folders
          cp -r build/src/config release-package/
          cp -r build/src/books release-package/
          
          # Remove cache files
          find release-package/books -name "*.cache.*" -delete
          
          echo "Release package contents:"
          ls -laR release-package

      - name: Upload build artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-linux-gcc-Release
          path: release-package/
          retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "Linux build: ${{ needs.build-linux.result }}"
          
          if [ "${{ needs.build-windows.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi

  # Automated release artifact upload (triggered only on version tags)
  release:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: frankycpp-windows-Release
          path: windows-release

      - name: Download Linux GCC artifacts
        uses: actions/download-artifact@v4
        with:
          name: frankycpp-linux-gcc-Release
          path: linux-release

      - name: Create Release Archives
        run: |
          echo "Creating Windows release archive..."
          cd windows-release
          zip -r ../FrankyCPP-${{ github.ref_name }}-Windows-MSVC.zip *
          cd ..
          
          echo "Creating Linux release archive..."
          cd linux-release
          tar czf ../FrankyCPP-${{ github.ref_name }}-Linux-GCC13.tar.gz *
          cd ..
          
          echo "Release archives created:"
          ls -lh FrankyCPP-*.{zip,tar.gz}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            FrankyCPP-${{ github.ref_name }}-Windows-MSVC.zip
            FrankyCPP-${{ github.ref_name }}-Linux-GCC13.tar.gz
          draft: false
          prerelease: false
