name: CI Build

on:
  push:
    branches: [ master, 'dev_*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: pwsh
        run: |
          # Use pre-installed vcpkg on GitHub runners
          Write-Host "vcpkg location: C:\vcpkg"
          if (Test-Path C:\vcpkg\vcpkg.exe) {
            Write-Host "vcpkg is available"
            C:\vcpkg\vcpkg.exe version
          } else {
            Write-Host "Bootstrapping vcpkg..."
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          # Set environment variable for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add Ninja to PATH
        run: |
          choco install ninja -y
          ninja --version

      - name: Configure CMake
        shell: pwsh
        run: |
          # Explicitly specify MSVC compilers to avoid MinGW
          cmake -B build `
            -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DFRANKYCPP_BUILD_TESTS=ON `
            -DFRANKYCPP_BUILD_BENCHMARKS=OFF `
            -DSTRICT_WARNINGS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: |
          ctest -C Release `
            --output-on-failure `
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Prepare release package
        shell: pwsh
        run: |
          # Create release package directory
          New-Item -ItemType Directory -Force -Path release-package
          
          # Copy executable
          Copy-Item build/src/FrankyCPP_*.exe release-package/
          
          # Copy config and books folders
          Copy-Item -Recurse build/src/config release-package/
          Copy-Item -Recurse build/src/books release-package/
          
          # Remove cache files
          Get-ChildItem -Path release-package/books -Filter "*.cache.*" -Recurse | Remove-Item
          
          Write-Host "Release package contents:"
          Get-ChildItem -Recurse release-package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-windows-Release
          path: release-package/
          retention-days: 30

  build-linux:
    name: Linux (${{ matrix.compiler }}) Release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          chmod +x ./setup_linux_build_env.sh
          # Pass environment variables through sudo and preserve working directory
          sudo -E bash -c "cd $(pwd) && ./setup_linux_build_env.sh --install"
        env:
          CI: true
          GITHUB_ACTIONS: true

      - name: Setup vcpkg environment
        run: |
          # In CI, vcpkg is installed to /opt/vcpkg by the setup script
          if [ -d "/opt/vcpkg" ]; then
            echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV
            echo "Using vcpkg at /opt/vcpkg"
          elif [ -d "$HOME/vcpkg" ]; then
            echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
            echo "Using vcpkg at $HOME/vcpkg"
          else
            echo "ERROR: vcpkg not found"
            exit 1
          fi

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DFRANKYCPP_BUILD_TESTS=ON \
            -DFRANKYCPP_BUILD_BENCHMARKS=OFF \
            -DSTRICT_WARNINGS=OFF

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Run tests
        working-directory: build
        run: |
          ctest -C Release \
            --output-on-failure \
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Prepare release package
        if: matrix.compiler == 'gcc'
        run: |
          # Create release package directory
          mkdir -p release-package
          
          # Copy executable (only the main one, not test)
          find build/src -maxdepth 1 -name "FrankyCPP_*" -type f -executable ! -name "*Test*" -exec cp {} release-package/ \;
          
          # Copy config and books folders
          cp -r build/src/config release-package/
          cp -r build/src/books release-package/
          
          # Remove cache files
          find release-package/books -name "*.cache.*" -delete
          
          echo "Release package contents:"
          ls -laR release-package

      - name: Upload build artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-linux-gcc-Release
          path: release-package/
          retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "Linux build: ${{ needs.build-linux.result }}"
          
          if [ "${{ needs.build-windows.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi

  # Automated release artifact upload (triggered only on version tags)
  release:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: frankycpp-windows-Release
          path: windows-release

      - name: Download Linux GCC artifacts
        uses: actions/download-artifact@v4
        with:
          name: frankycpp-linux-gcc-Release
          path: linux-release

      - name: Create Release Archives
        run: |
          echo "Creating Windows release archive..."
          cd windows-release
          zip -r ../FrankyCPP-${{ github.ref_name }}-Windows-MSVC.zip *
          cd ..
          
          echo "Creating Linux release archive..."
          cd linux-release
          tar czf ../FrankyCPP-${{ github.ref_name }}-Linux-GCC13.tar.gz *
          cd ..
          
          echo "Release archives created:"
          ls -lh FrankyCPP-*.{zip,tar.gz}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            FrankyCPP-${{ github.ref_name }}-Windows-MSVC.zip
            FrankyCPP-${{ github.ref_name }}-Linux-GCC13.tar.gz
          draft: false
          prerelease: false
