name: CI Build

on:
  push:
    branches: [ master, 'dev_*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: pwsh
        run: |
          # Use pre-installed vcpkg on GitHub runners
          Write-Host "vcpkg location: C:\vcpkg"
          if (Test-Path C:\vcpkg\vcpkg.exe) {
            Write-Host "vcpkg is available"
            C:\vcpkg\vcpkg.exe version
          } else {
            Write-Host "Bootstrapping vcpkg..."
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          # Set environment variable for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Add Ninja to PATH
        run: |
          choco install ninja -y
          ninja --version

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DFRANKYCPP_BUILD_TESTS=ON `
            -DFRANKYCPP_BUILD_BENCHMARKS=OFF `
            -DSTRICT_WARNINGS=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.config }} -j $env:NUMBER_OF_PROCESSORS

      - name: Run tests
        shell: pwsh
        working-directory: build
        run: |
          ctest -C ${{ matrix.config }} `
            --output-on-failure `
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Upload build artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-windows-${{ matrix.config }}
          path: |
            build/src/FrankyCPP_*.exe
            build/test/FrankyCPP_*_Test.exe
          retention-days: 30

  build-linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.config }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          chmod +x ./setup_linux_build_env.sh
          # Pass environment variables through sudo and preserve working directory
          sudo -E bash -c "cd $(pwd) && ./setup_linux_build_env.sh --install"
        env:
          CI: true
          GITHUB_ACTIONS: true

      - name: Setup vcpkg environment
        run: |
          # In CI, vcpkg is installed to /opt/vcpkg by the setup script
          if [ -d "/opt/vcpkg" ]; then
            echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV
            echo "Using vcpkg at /opt/vcpkg"
          elif [ -d "$HOME/vcpkg" ]; then
            echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
            echo "Using vcpkg at $HOME/vcpkg"
          else
            echo "ERROR: vcpkg not found"
            exit 1
          fi

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DFRANKYCPP_BUILD_TESTS=ON \
            -DFRANKYCPP_BUILD_BENCHMARKS=OFF \
            -DSTRICT_WARNINGS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j $(nproc)

      - name: Run tests
        working-directory: build
        run: |
          ctest -C ${{ matrix.config }} \
            --output-on-failure \
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Upload build artifacts
        if: matrix.config == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-linux-gcc-${{ matrix.config }}
          path: |
            build/src/FrankyCPP_*
            build/test/FrankyCPP_*_Test
          retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "Linux build: ${{ needs.build-linux.result }}"
          
          if [ "${{ needs.build-windows.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi
