name: CI Build

on:
  push:
    branches: [ master, 'dev_*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Add Ninja to PATH
        run: |
          choco install ninja -y
          ninja --version

      - name: Configure CMake
        run: |
          cmake -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DFRANKYCPP_BUILD_TESTS=ON `
            -DFRANKYCPP_BUILD_BENCHMARKS=OFF `
            -DSTRICT_WARNINGS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j $env:NUMBER_OF_PROCESSORS

      - name: Run tests
        working-directory: build
        run: |
          ctest -C ${{ matrix.config }} `
            --output-on-failure `
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Upload build artifacts
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-windows-${{ matrix.config }}
          path: |
            build/src/FrankyCPP_*.exe
            build/test/FrankyCPP_*_Test.exe
          retention-days: 30

  build-linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.config }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          chmod +x ./setup_linux_build_env.sh
          sudo ./setup_linux_build_env.sh --install
        env:
          CI: true

      - name: Setup vcpkg environment
        run: |
          echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DFRANKYCPP_BUILD_TESTS=ON \
            -DFRANKYCPP_BUILD_BENCHMARKS=OFF \
            -DSTRICT_WARNINGS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j $(nproc)

      - name: Run tests
        working-directory: build
        run: |
          ctest -C ${{ matrix.config }} \
            --output-on-failure \
            -E ".*SpeedTests.*|.*TimingTests.*"

      - name: Upload build artifacts
        if: matrix.config == 'Release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: frankycpp-linux-gcc-${{ matrix.config }}
          path: |
            build/src/FrankyCPP_*
            build/test/FrankyCPP_*_Test
          retention-days: 30

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "Linux build: ${{ needs.build-linux.result }}"
          
          if [ "${{ needs.build-windows.result }}" != "success" ] || [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "❌ One or more builds failed"
            exit 1
          else
            echo "✅ All builds succeeded"
          fi
