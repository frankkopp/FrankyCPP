name: FrankyCPP Build

on:
  push:
#    branches: [ master, dev_* ]
  pull_request:
#    branches: [ master ]

jobs:
  build-linux:
    name: Linux Build (Ubuntu)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-11
            cxx: g++-11
          - compiler: clang
            cc: clang-15
            cxx: clang++-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        chmod +x ./setup_linux_build_env.sh
        sudo ./setup_linux_build_env.sh --install
      env:
        CI: true

    - name: Setup vcpkg environment
      run: |
        echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV

    - name: Configure CMake
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DFRANKYCPP_BUILD_TESTS=ON \
          -DFRANKYCPP_BUILD_BENCHMARKS=OFF \
          -DSTRICT_WARNINGS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j $(nproc)

    - name: Run tests
      working-directory: build
      run: |
        ctest -C ${{ matrix.build_type }} \
          --output-on-failure \
          -E ".*SpeedTests.*|.*TimingTests.*"

    - name: Upload build artifacts
      if: matrix.build_type == 'Release' && matrix.compiler == 'gcc'
      uses: actions/upload-artifact@v4
      with:
        name: frankycpp-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: |
          build/src/FrankyCPP_*
          !build/**/*.o
          !build/**/*.a

  build-windows:
    name: Windows Build (MSVC)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: |
        cmake -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
          -DFRANKYCPP_BUILD_TESTS=ON `
          -DFRANKYCPP_BUILD_BENCHMARKS=OFF `
          -DSTRICT_WARNINGS=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j $env:NUMBER_OF_PROCESSORS

    - name: Run tests
      working-directory: build
      run: |
        ctest -C ${{ matrix.build_type }} `
          --output-on-failure `
          -E ".*SpeedTests.*|.*TimingTests.*"

    - name: Upload build artifacts
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: frankycpp-windows-${{ matrix.build_type }}
        path: |
          build/src/FrankyCPP_*.exe
          !build/**/*.obj
          !build/**/*.lib

  validation:
    name: Environment Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        chmod +x ./setup_linux_build_env.sh
        sudo ./setup_linux_build_env.sh --install

    - name: Run validation script
      run: |
        ./setup_linux_build_env.sh --validate
