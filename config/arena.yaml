# =============================================================================
# Benchmark Configuration
# =============================================================================
# Benchmarks measure engine performance (NPS - nodes per second) using a fixed
# set of 50 positions. Results are stored in results/benchmarks/benchmarks.json
# and can be viewed with: FrankyCPP_Arena --bench-report
#
# Configuration:
#   name:           Descriptive name for this benchmark run
#   engineVersion:  Version string for results (defaults to global 'version')
#   depth:          Search depth (1-127, default: 10)
#   hashSizeMB:     Hash table size in MB (1-65536, default: 128)
#   threads:        Number of threads (1-256, default: 1, reserved for SMP)
#   tag:            Feature tag for tracking (e.g., "QuietSee") - replaces notes
#   enginePath:     Path to external engine (empty = use internal engine)
#   commandLineArgs: Command-line arguments for external engine
#
# Usage:
#   FrankyCPP_Arena --bench          Run all configured benchmarks
#   FrankyCPP_Arena -b               Same as --bench
#   FrankyCPP_Arena --bench-report   Show benchmark history
# =============================================================================

benchmarks:
  - name: "v1.6 Internal"
    engineVersion: "v1.6"
    depth: 12
    hashSizeMB: 128
    threads: 4
    tag: ""  # Set to current feature name when testing

  - name: "v1.6 External"
    enginePath: "Release/FrankyCPP_v1.6/FrankyCPP_v1.6.exe"
    commandLineArgs: "--nobook"
    engineVersion: "v1.6"
    depth: 12
    hashSizeMB: 128
    threads: 4
    tag: ""  # Set to current feature name when testing

