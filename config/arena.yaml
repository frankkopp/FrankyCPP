version: "v1.1"
resultsDir: "./results"

# Cutechess-cli path (Windows)
# Adjust this path to match your cutechess-cli installation
cutechessPath: "D:/Games/CuteChess/cutechess-cli.exe"

# Test suite configurations
testSuites:
  - name: "franky_tests"
    epdPath: "test/testsets/franky_tests.epd"
    timePerMove: 5000  # milliseconds
    maxDepth: 30

  - name: "mate_test"
    epdPath: "test/testsets/mate_test_suite.epd"
    timePerMove: 15000
    maxDepth: 30

  - name: "WAC"
    epdPath: "test/testsets/wac.epd"
    timePerMove: 5000
    maxDepth: 30

  # Uncomment to enable more test suites
  # - name: "STS"
  #   epdPath: "test/testsets/STS1-STS15_LAN.EPD"
  #   timePerMove: 5000
  #   maxDepth: 30

  # - name: "Crafty"
  #   epdPath: "test/testsets/crafty_test.epd"
  #   timePerMove: 5000
  #   maxDepth: 30

  # - name: "ECM98"
  #   epdPath: "test/testsets/ecm98.epd"
  #   timePerMove: 5000
  #   maxDepth: 30


# Match configurations
# Note: Uncomment and adjust paths to enable matches
# Opening book must be in PGN format for cutechess-cli

# Debug mode - prints engine I/O communication during matches
# Set to true to see all UCI commands/responses for debugging
# Uses cutechess-cli "-debug all" flag to display engine communication
# Default: false (cleaner output)
debugMode: false

matches:
