# ==========================================================================
# Match configurations
# Note: Uncomment and adjust paths to enable matches
# Opening book must be in PGN format for cutechess-cli
# ==========================================================================

# Debug mode - prints engine I/O communication during matches
# Set to true to see all UCI commands/responses for debugging
# Uses cutechess-cli "-debug all" flag to display engine communication
# Default: false (cleaner output)
debugMode: false

matches:

## current dev vs. v1.5
  - name: "v1.6_vs_v1.5_300s"
    tag: ""  # Set to current feature name when testing
    engine1Path: "Release/FrankyCPP_v1.6/FrankyCPP_v1.6.exe"
    engine1Version: "v1.6"
    engine2Path: "Release/FrankyCPP_v1.5/FrankyCPP_v1.5.exe"
    engine2Version: "v1.5"
    openingBook: "books/8moves_GM_LB.pgn"
    timeControl: "300+0"
    rounds: 100
    concurrency: 4
    outputPgn: "results/matches/v1.6_vs_v1.5_300s.pgn"

  ## current dev vs. Stockfish 18 (limited to 2700 ELO)
  - name: "v1.6_vs_Stockfish18_2700_300s"
    tag: ""  # Set to current feature name when testing
    engine1Path: "Release/FrankyCPP_v1.6/FrankyCPP_v1.6.exe"
    engine1Version: "v1.6"
    engine1Options: "OwnBook=false"
    engine2Path: "D:/_DEV/Stockfish/src/stockfish.exe"
    engine2Version: "18-2700"
    engine2Options: "UCI_LimitStrength=true; UCI_Elo=2700"
    openingBook: "books/8moves_GM_LB.pgn"
    timeControl: "300+0"
    rounds: 100
    concurrency: 4
    outputPgn: "results/matches/v1.6_vs_Stockfish18_2700_300s.pgn"

