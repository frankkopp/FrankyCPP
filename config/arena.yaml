# =============================================================================
# Test Suite Runs Configuration (testSuiteRuns)
# =============================================================================
#
# The testSuiteRuns format defines shared settings for multiple EPD test suites,
# eliminating duplication when running the same engine against multiple suites.
#
# Required Fields:
#   engine:          Display name for the engine (e.g., "FrankyCPP v1.7")
#   engineVersion:   Version string for results grouping (e.g., "v1.7")
#   enginePath:      Path to the engine executable
#   timePerMove:     Default time limit per move in milliseconds
#   maxDepth:        Default maximum search depth
#   suites:          List of EPD files to test
#
# Optional Fields:
#   tag:             Feature tag for tracking development progress (e.g., "QuietSee")
#                    Empty tag triggers a validation warning
#   isolatePositions: Clear engine state between positions (default: true)
#   debugMode:       Print UCI communication (default: false)
#   commandLineArgs: Command-line arguments passed to engine at startup
#   uciOptions:      UCI options sent after engine starts (semicolon-separated)
#   parallelWorkers: Number of parallel engine instances (default: 1)
#
# Suite List Formats:
#   - Simple string: "path/to/suite.epd"
#   - Override object: { path: "path/to/suite.epd", timePerMove: 15000, maxDepth: 50 }
#
# Example:
#   testSuiteRuns:
#     - engine: "FrankyCPP v1.7"
#       engineVersion: "v1.7"
#       tag: "QuietSee"
#       enginePath: "Release/FrankyCPP_v1.7/FrankyCPP_v1.7.exe"
#       timePerMove: 5000
#       maxDepth: 99
#       commandLineArgs: "--nobook"
#       parallelWorkers: 2
#       suites:
#         - "test/testsets/wac.epd"
#         - path: "test/testsets/mate_test_suite.epd"
#           timePerMove: 15000    # Override for this suite only
#
# Path Format:
#   Windows: Use forward slashes (/) or double backslashes (\\)
#   Examples: "D:/Games/engine.exe" or "D:\\Games\\engine.exe"
#   Linux: Standard Unix paths: "/usr/local/bin/engine"
#
# Position Isolation:
#   isolatePositions: true (default) - Sends "ucinewgame" between positions
#     - Clears transposition table and history tables for fair comparison
#     - Ensures each position is evaluated independently
#   isolatePositions: false - Reuses engine state across positions
#     - Faster but TT/history from previous positions may affect results
#
# Command-Line Arguments vs UCI Options:
#   commandLineArgs: Passed when STARTING the engine (before UCI init)
#                    Engine-specific syntax, non-standard
#   uciOptions:      Sent AFTER engine starts via UCI protocol
#                    Standard UCI format, portable across engines
#                    Format: "OwnBook=false; Hash=256" (semicolon-separated)
#
# Engine Lifecycle:
#   - One engine process is started per suite with the specified command-line args
#   - Engine is initialized via UCI protocol (sends "uci", waits for "uciok")
#   - Engine is reused across all positions in the suite
#   - "ucinewgame" is sent between positions if isolatePositions=true
#   - Engine is terminated after suite completes
#
# =============================================================================

