# ==========================================================================
# Match configurations
# ==========================================================================
#
# New fields (with defaults — only specify in YAML to override):
#   timeMargin:      200   # cutechess -timemargin (ms), compensates for post-stop overhead
#   recover:         true  # -recover flag: restart engine on crash
#   drawMoveNumber:  40    # draw adjudication: earliest move (0 = disabled)
#   drawMoveCount:   8     # draw adjudication: consecutive moves below threshold
#   drawScore:       10    # draw adjudication: centipawn threshold
#   resignMoveCount: 3     # resign adjudication: consecutive moves (0 = disabled)
#   resignScore:     600   # resign adjudication: centipawn threshold
#
# Fishtest/OpenBench conventions (for reference — FrankyCPP uses Threads=4):
#   STC  = 10+0.1   (increment = 1% of base)
#   LTC  = 60+0.6
#   VLTC = 180+1.8
#   Adjudication: resign 3/600, draw 40/8/10
#   Fishtest uses Threads=1, Hash=16-64MB (for SPRT over 40k+ games on diverse HW)
#
# Opening book must be in PGN format for cutechess-cli
# ==========================================================================

# Debug mode - prints engine I/O communication during matches
# Set to true to see all UCI commands/responses for debugging
# Uses cutechess-cli "-debug all" flag to display engine communication
# Default: false (cleaner output)
debugMode: false

