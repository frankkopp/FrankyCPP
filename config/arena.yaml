  - name: "v1.1_vs_v0.5_blitz"
    engine1Path: "cmake-build-win-release/src/FrankyCPP_v1.1.exe"
    engine2Path: "Release/FrankyCPP_V0.5/FrankyCPP_v0.5.exe"
    openingBook: "books/8moves_GM_LB.pgn"  # PGN format required for cutechess-cli
    timeControl: "60+0.6"  # Format: "base+increment"
    rounds: 100
    concurrency: 4  # Run 4 games in parallel for faster execution
    outputPgn: "results/matches/v1.1_vs_v0.5_blitz.pgn"

