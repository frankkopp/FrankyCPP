version: "v1.2"
resultsDir: "./results"

# Cutechess-cli path (Windows)
# Adjust this path to match your cutechess-cli installation
# Note: Use forward slashes (/) or double backslashes (\\) for Windows paths
cutechessPath: "D:/Games/CuteChess/cutechess-cli.exe"

# Currently installed engines:
# Release/FrankyCPP_V0.5/FrankyCPP_v0.5.exe
# Release/FrankyCPP_V1.0/FrankyCPP_v1.0.exe
# Release/FrankyCPP_V1.1/FrankyCPP_v1.1.exe
# Release/FrankyCPP_V1.2/FrankyCPP_v1.2.exe
# D:/Games/FrankyChess/FrankyGo/FrankyGo.exe
# "D:/Games/arena_3.5.1/Engines/Ruffian/Ruffian_105.exe"
# "D:/_DEV/Stockfish/src/stockfish.exe"

# Test suite configurations
# Each test suite requires an external UCI engine path.
# External engines must support UCI protocol and respond to standard commands.
#
# Path Format:
#   Windows: Use forward slashes (/) or double backslashes (\\)
#   Examples: "D:/Games/engine.exe" or "D:\\Games\\engine.exe"
#   Linux: Standard Unix paths: "/usr/local/bin/engine"
#
# Position Isolation:
#   isolatePositions: true (default) - Sends "ucinewgame" between positions
#     - Clears transposition table and history tables for fair comparison
#     - Ensures each position is evaluated independently
#     - Slightly slower but guarantees comparable results
#   isolatePositions: false - Reuses engine state across positions
#     - Faster but TT/history from previous positions may affect results
#     - Only use for non-comparative testing or if you understand the implications
#
# Debug Mode:
#   debugMode: true - Prints all UCI communication (engine input/output)
#     - Useful for troubleshooting engine behavior
#     - Shows exactly what commands are sent and received
#     - WARNING: Very verbose output
#   debugMode: false (default) - Normal output only
#
# Command-Line Arguments:
#   commandLineArgs: "args" - Command-line arguments to pass when starting the engine
#     - Format: Exactly as you would type them in a shell
#     - Passed BEFORE UCI initialization
#     - Engine-specific syntax (check engine documentation):
#       FrankyCPP:     "--nobook" (disable opening book via command-line)
#       Some engines:  "-option value" or "--option value" or "/option value"
#     - Examples:
#       ""                           - No arguments (use defaults)
#       "--nobook"                   - Single argument
#       "--nobook --threads 4"       - Multiple arguments
#   commandLineArgs: "" (default) - No arguments, use engine defaults
#
# UCI Options:
#   uciOptions: "options" - UCI setoption commands sent AFTER engine starts
#     - Format: Semicolon-separated "name=value" pairs
#     - Sent via UCI protocol: "setoption name <name> value <value>"
#     - Option names CAN contain spaces (per UCI spec)
#     - Use semicolon separator to avoid ambiguity with multi-word names
#
#     UCI Standard Options (single-word names):
#       Hash           - Hash table size in MB
#       Threads        - Number of search threads
#       Ponder         - Think on opponent's time
#       MultiPV        - Number of principal variations
#       OwnBook        - Use opening book (true/false)
#
#     FrankyCPP Supports:
#       - All UCI standard options (OwnBook, Hash, Ponder, MultiPV)
#       - FrankyCPP-specific options (see src/engine/UciOptions.cpp)
#       - Some option names may contain spaces per UCI spec
#
#     Examples:
#       ""                                    - No options (use defaults)
#       "OwnBook=false"                       - Disable opening book
#       "OwnBook=false; Hash=128"             - Multiple options
#       "Hash=256; Threads=4"                 - Standard UCI options
#   uciOptions: "" (default) - No UCI options, use engine defaults
#
# IMPORTANT: Use semicolon (;) to separate multiple options!
#   Correct:   "OwnBook=false; Hash=256"
#   Wrong:     "OwnBook=false Hash=256"  (space-separated won't work reliably)
#
# Difference: commandLineArgs vs uciOptions:
#   - commandLineArgs: Passed when STARTING the engine (before UCI init)
#                      Engine-specific syntax, non-standard
#   - uciOptions:      Sent AFTER engine starts via UCI protocol
#                      Standard UCI format, portable across engines
#
# Recommendation:
#   - Use uciOptions when possible (standard, portable)
#   - Use commandLineArgs only for options not available via UCI
#
# Engine Lifecycle:
#   - One engine process is started per test suite with the specified command-line args
#   - Engine is initialized via UCI protocol (sends "uci", waits for "uciok")
#   - Engine is reused across all positions in the suite
#   - "ucinewgame" is sent between positions if isolatePositions=true
#   - Engine is terminated after suite completes
testSuites:

  # ==========================================================================
  # FrankyCPP v1.4 test suites
