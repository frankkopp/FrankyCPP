# FrankyCPP Evaluation Configuration (flat keys)
# Mirrors defaults in src/config/EvalConfigData.h
#
# Tuned values applied from: results/tuning/tuning_selfplay_4.yaml
# Texel tuner: 50-pass coordinate descent on 4.57M selfplay positions
# Sign-flipped parameters zeroed per review recommendation (see tuning_selfplay_4_review.md)
#
# Format: "NEW_VALUE  # was: OLD_VALUE" for changed parameters
# All USE_* toggles are explicitly set (not relying on header defaults).

# Debugging
EVAL_CONFIG_SOURCE: "yaml-file"

# Marker for smoke tests - ensures YAML file is present and parseable
# DO NOT REMOVE - used by ConfigYamlSmokeTest
# Keys starting with '_' are reserved for internal/test use and silently ignored by the parser.
_YAML_SMOKE_TEST_MARKER: true

# Enable base material evaluation (piece values)
USE_MATERIAL: true
# Enable positional evaluation (all non-material heuristics)
USE_POSITIONAL: true

# Apply a tempo bonus to the side to move
USE_TEMPO: true
TEMPO: 4  # was: 34 (-88%) — largest single change, validate in gauntlet

# Enable lazy evaluation shortcut for obviously winning/losing positions
USE_LAZY_EVAL: true
LAZY_THRESHOLD: 706  # was: 700

# Enable pawn structure evaluation
USE_PAWN_EVAL: true
# Use pawn transposition table to cache pawn eval
USE_PAWN_TT: true
# Pawn TT size in megabytes
# PAWN_TT_SIZE_MB: 16

# Pawn structure weights (centipawns), midgame and endgame
ISOLATED_PAWN_MID_WEIGHT: -7  # was: -10
ISOLATED_PAWN_END_WEIGHT: -7  # was: -20
DOUBLED_PAWN_MID_WEIGHT: -1  # was: -10
DOUBLED_PAWN_END_WEIGHT: -19  # was: -30
PASSED_PAWN_MID_WEIGHT: 0  # was: 20 (zeroed by tuner)
PASSED_PAWN_END_WEIGHT: 69  # was: 40

# Rank-based passed pawn bonus (added on top of flat weight).
# Array indexed by relative rank 2..7 (index 0..5).
USE_PASSED_PAWN_RANK_BONUS: true
PASSED_PAWN_RANK_MID_BONUS: -50,-33,12,65,70,70  # was: 0,0,5,15,35,70
PASSED_PAWN_RANK_END_BONUS: 18,41,51,84,101,120  # was: 0,5,15,35,70,120

BLOCKED_PAWN_MID_WEIGHT: 0  # was: -2 (zeroed by tuner)
BLOCKED_PAWN_END_WEIGHT: -10  # was: -20
PHALANX_PAWN_MID_WEIGHT: 5  # was: 4
PHALANX_PAWN_END_WEIGHT: 9  # was: 4
SUPPORTED_PAWN_MID_WEIGHT: 21  # was: 10
SUPPORTED_PAWN_END_WEIGHT: 0  # was: 15 (zeroed by tuner)

# Pawn advancement bonus: bonus for non-passed pawns advanced to rank 4+
# Indexed by (relativeRank - 4): {rank4, rank5, rank6, rank7}
USE_PAWN_ADVANCE_BONUS: true
PAWN_ADVANCE_MID_BONUS: 11,12,12,25  # was: 2,5,12,25
PAWN_ADVANCE_END_BONUS: 0,4,18,35  # was: 3,8,18,35 — tuned: -10,4,18,35 — [0] zeroed: sign-flip

# Enable piece-related evaluation terms (mobility, pair bonuses, etc.)
USE_PIECE_EVAL: true

# Bishop pair bonus (centipawns), midgame and endgame
USE_BISHOP_PAIR_BONUS: true
BISHOP_PAIR_MID_BONUS: 52  # was: 30
BISHOP_PAIR_END_BONUS: 66  # was: 45

# Knight mobility
USE_KNIGHT_MOBILITY: true
KNIGHT_MOBILITY_MID_PER_MOVE: 3  # was: 3 (unchanged)
KNIGHT_MOBILITY_END_PER_MOVE: 4  # was: 2
# Additional low-mobility penalties (centipawns)
KNIGHT_LOW_MOBILITY_LEQ1_MID: 0  # was: -6 (zeroed by tuner)
KNIGHT_LOW_MOBILITY_LEQ1_END: -10  # was: -6
KNIGHT_LOW_MOBILITY_LEQ2_MID: 0  # was: -3 (zeroed by tuner)
KNIGHT_LOW_MOBILITY_LEQ2_END: 0  # was: -3 (zeroed by tuner)

# Knight outpost: bonus for knight on square that cannot be attacked by enemy pawns
USE_KNIGHT_OUTPOST: true
KNIGHT_OUTPOST_SUPPORTED_MID: 39  # was: 20
KNIGHT_OUTPOST_SUPPORTED_END: 21  # was: 15
KNIGHT_OUTPOST_UNSUPPORTED_MID: 39  # was: 10
KNIGHT_OUTPOST_UNSUPPORTED_END: 5  # was: 8

# Bishop mobility
USE_BISHOP_MOBILITY: true
BISHOP_MOBILITY_MID_PER_MOVE: 2  # was: 2 (unchanged)
BISHOP_MOBILITY_END_PER_MOVE: 6  # was: 3
BISHOP_LOW_MOBILITY_LEQ3_MID: 0  # was: -4 (zeroed by tuner)
BISHOP_LOW_MOBILITY_LEQ3_END: -24  # was: -2

# Bad bishop: penalty when own pawns are on the same color squares as the bishop
USE_BAD_BISHOP: true
BAD_BISHOP_PER_PAWN_MID: 0  # was: -3 (zeroed by tuner — removal candidate)
BAD_BISHOP_PER_PAWN_END: 0  # was: -5 (zeroed by tuner — removal candidate)

# Rook mobility and file bonuses
USE_ROOK_MOBILITY: true
ROOK_MOBILITY_MID_PER_MOVE: 2  # was: 2 (unchanged)
ROOK_MOBILITY_END_PER_MOVE: 9  # was: 2
ROOK_LOW_MOBILITY_LEQ3_MID: 0  # was: -3 (zeroed by tuner)
ROOK_LOW_MOBILITY_LEQ3_END: 0  # was: -3 (zeroed by tuner)

# Open/semi-open file bonuses (centipawns)
USE_ROOK_OPEN_FILE_BONUS: true
ROOK_OPEN_FILE_MID_BONUS: 24  # was: 10
ROOK_OPEN_FILE_END_BONUS: 9  # was: 8
ROOK_SEMIOPEN_FILE_MID_BONUS: 11  # was: 5
ROOK_SEMIOPEN_FILE_END_BONUS: 14  # was: 4

# Rook on 7th rank bonus (relative to its color; 2nd rank for Black)
USE_ROOK_7TH_RANK_BONUS: true
ROOK_7TH_RANK_MID_BONUS: 41  # was: 15
ROOK_7TH_RANK_END_BONUS: 9  # was: 25

# Rook behind passed pawn: bonus for rook behind own or enemy passed pawns
USE_ROOK_BEHIND_PASSER: true
ROOK_BEHIND_PASSER_OWN_MID: 1  # was: 10
ROOK_BEHIND_PASSER_OWN_END: 24  # was: 20
ROOK_BEHIND_PASSER_OPP_MID: 13  # was: 8
ROOK_BEHIND_PASSER_OPP_END: 19  # was: 15

# Queen mobility and king tropism
USE_QUEEN_MOBILITY: true
QUEEN_MOBILITY_MID_PER_MOVE: 1  # was: 1 (unchanged)
QUEEN_MOBILITY_END_PER_MOVE: 11  # was: 1
# Small bonus for queen proximity to enemy king (per Manhattan step)
USE_QUEEN_TROPISM: true
QUEEN_TROPISM_MID_PER_STEP: 2  # was: 0
QUEEN_TROPISM_END_PER_STEP: 20  # was: 1

# King evaluation and pawn shield
USE_KING_EVAL: true
# Bonus per pawn in the king's shield (midgame only)
USE_KING_SAFETY_SHIELD: true
KING_SHIELD_MID_PER_PAWN: 0  # was: 5 (zeroed by tuner)
KING_SHIELD_END_PER_PAWN: 0  # was: 0 (unchanged)

# King proximity to passed pawns (endgame bonus)
USE_KING_PAWN_PROXIMITY: true
KING_OWN_PASSED_PROXIMITY_END: 5  # was: 5 (unchanged)
KING_OPP_PASSED_PROXIMITY_END: 20  # was: 3

# King safety: attack evaluation (midgame penalty for pieces attacking the king zone)
USE_KING_SAFETY_ATTACK: true
KING_ATTACK_WEIGHT_KNIGHT: 2  # was: 2 (unchanged)
KING_ATTACK_WEIGHT_BISHOP: 2  # was: 2 (unchanged)
KING_ATTACK_WEIGHT_ROOK: 3  # was: 3 (unchanged)
KING_ATTACK_WEIGHT_QUEEN: 3  # was: 4
# Non-linear penalty table — sharper curve: low danger decreased, high danger increased
KING_SAFETY_TABLE: 0,0,5,15,19,47,51,116,135,135,227,307,348,380,380,400  # was: 0,0,5,15,30,50,75,105,140,180,220,260,300,340,380,400

# Pawn storm: penalty when opponent pawns advance toward our king (midgame only)
# Indexed by (relativeRank - 4): {rank4, rank5, rank6, rank7}
USE_PAWN_STORM: true
PAWN_STORM_MID_PENALTY: 0,15,15,50  # was: 5,15,30,50 — tuned: -12,15,15,50 — [0] zeroed: sign-flip

# Open file near king: penalty for open/semi-open files adjacent to king (midgame only)
USE_KING_OPEN_FILE: true
KING_OPEN_FILE_MID_PENALTY: -24  # was: -20
KING_SEMIOPEN_FILE_MID_PENALTY: 0  # was: -10 (zeroed by tuner)

# Safe check squares: penalty for squares from which enemy can give check without being captured
# Per-piece-type penalties (midgame only, negative values = penalty for the defending side)
USE_SAFE_CHECK: true
SAFE_CHECK_KNIGHT_MID: -15  # was: -10
SAFE_CHECK_BISHOP_MID: 0  # was: -8 (zeroed by tuner)
SAFE_CHECK_ROOK_MID: -17  # was: -12
SAFE_CHECK_QUEEN_MID: -11  # was: -15

# Threat evaluation: bonus for pieces attacked by lesser-value pieces and hanging pieces
# Three tiers: (1) pawn attacks on pieces, (2) minor attacks on majors, (3) hanging pieces
USE_THREAT_EVAL: true
# Tier 1: pawn attacks on pieces (per victim type)
THREAT_BY_PAWN_MINOR_MID: 44  # was: 5
THREAT_BY_PAWN_MINOR_END: 12  # was: 5
THREAT_BY_PAWN_ROOK_MID: 48  # was: 10
THREAT_BY_PAWN_ROOK_END: 18  # was: 12
THREAT_BY_PAWN_QUEEN_MID: 30  # was: 15
THREAT_BY_PAWN_QUEEN_END: 10  # was: 20
# Tier 2: minor piece attacks on major pieces
THREAT_BY_MINOR_ROOK_MID: 55  # was: 5
THREAT_BY_MINOR_ROOK_END: 0  # was: 6 — tuned: -14 — zeroed: sign-flip
THREAT_BY_MINOR_QUEEN_MID: 28  # was: 8
THREAT_BY_MINOR_QUEEN_END: 20  # was: 10
# Tier 3: hanging pieces (attacked by us, not defended by them)
THREAT_HANGING_MID: 7  # was: 6
THREAT_HANGING_END: 43  # was: 10

# Space evaluation: safe squares behind own pawn chain (midgame-weighted)
# DISABLED: Confirmed dead by tuner — sign-flipped in all 3 datasets
USE_SPACE_EVAL: false
SPACE_BONUS_MID: 0  # was: 3 — tuned: -2 — zeroed: sign-flip
SPACE_BONUS_END: 0  # was: 1 — tuned: -1 — zeroed: sign-flip

# Connected rooks: bonus when two rooks are on the same rank/file with no pieces between
# ENABLED: Tuner found strong endgame bonus (+46); MID sign-flipped and zeroed
USE_CONNECTED_ROOKS: true  # was: false — enabled based on tuned END value
CONNECTED_ROOKS_MID_BONUS: 0  # was: 8 — tuned: -13 — zeroed: sign-flip
CONNECTED_ROOKS_END_BONUS: 46  # was: 5

# Minor piece connectivity: bonus when knight/bishop is defended by another minor piece
# ENABLED: Tuner found positive values for both phases
USE_MINOR_CONNECTIVITY: true  # was: false — enabled based on tuned values
MINOR_CONNECTIVITY_MID_BONUS: 1  # was: 4
MINOR_CONNECTIVITY_END_BONUS: 5  # was: 3

# Use gamephase value blending (e.g., tapered eval)
USE_GAMEPHASE_VALUE: true
